<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Host Scheduler</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="center-page">
  <div class="auth-card">
    <h1>Jadwal Host Live</h1>
    <p class="sub">Login HR / Admin untuk kelola jadwal mingguan</p>
    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit">Masuk</button>
      <p class="error-msg" id="errorMsg"></p>
    </form>
    <p style="text-align:center;margin-top:18px;font-size:12.5px;">
      <a href="/request-libur.html" style="color:var(--accent);font-weight:600;">Host mau request libur? klik di sini</a>
    </p>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login gagal');
    window.location.href = '/';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
